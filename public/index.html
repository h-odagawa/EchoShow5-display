<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#05070b">
    <title>時計とニュース</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="clock-screen" aria-label="時計とニュース">
      <section class="clock" aria-live="off">
        <p id="date" class="date"></p>
        <time id="time" class="time"></time>
      </section>
      <section class="news" aria-label="NHKニュース">
        <p class="news-label">NHK NEWS</p>
        <div class="ticker-window" aria-label="NHKニュース見出し">
          <div id="ticker" class="ticker" aria-live="polite">
            ニュースを読み込んでいます
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
